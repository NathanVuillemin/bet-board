<!doctype html>
<html lang="en">
<head>
<title>Bet Builder Board</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky matchday bar → league bands → match cards; a side sheet opens a match, a pick expands in place. */
:root {
  --bg: #eef2f0; --surface: #ffffff; --surface-2: #f5f8f6; --ink: #13201b; --muted: #5a6b63; --line: #d3dcd7;
  --accent: #a8650f; --accent-soft: #f6e7cf; --ok: #1d7f47; --ok-soft: #dcf0e3; --bad: #b5402b; --bad-soft: #f7e1dc;
  --warn: #9a6a00; --warn-soft: #f6ecd0; --pip-off: #d9e0dc; --shadow: 0 1px 2px rgb(20 32 27 / .06), 0 4px 14px rgb(20 32 27 / .06);
  --scrim: rgb(10 18 15 / .45);
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0c1311; --surface: #131c19; --surface-2: #18231f; --ink: #e4ece8; --muted: #8ea098; --line: #24332d;
  --accent: #efb24a; --accent-soft: #3a2c13; --ok: #4cc37e; --ok-soft: #14301f; --bad: #ef7a62; --bad-soft: #3a1c16;
  --warn: #e3b647; --warn-soft: #352a10; --pip-off: #2b3a34; --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 18px rgb(0 0 0 / .25);
  --scrim: rgb(0 0 0 / .6); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0c1311; --surface: #131c19; --surface-2: #18231f; --ink: #e4ece8; --muted: #8ea098; --line: #24332d;
  --accent: #efb24a; --accent-soft: #3a2c13; --ok: #4cc37e; --ok-soft: #14301f; --bad: #ef7a62; --bad-soft: #3a1c16;
  --warn: #e3b647; --warn-soft: #352a10; --pip-off: #2b3a34; --shadow: 0 1px 2px rgb(0 0 0 / .3), 0 6px 18px rgb(0 0 0 / .25);
  --scrim: rgb(0 0 0 / .6); color-scheme: dark }

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
.wrap { max-width: 1320px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 20px; padding-block: 10px; }
.brand { display: flex; align-items: baseline; gap: 10px; margin-right: auto; }
.brand h1 { font-family: var(--f-display); font-weight: 700; font-size: 26px; letter-spacing: .02em; text-transform: uppercase; margin: 0; }
.brand .date { color: var(--muted); font-size: 14px; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tab { border: 1px solid transparent; background: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-weight: 600; color: var(--muted); }
.tab[aria-selected="true"] { color: var(--ink); background: var(--surface-2); border-color: var(--line); }
.tab .ct { font-family: var(--f-mono); font-size: 12px; margin-left: 6px; color: var(--muted); }

/* filters + summary */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px; padding-block: 16px 4px; }
.stats { display: flex; flex-wrap: wrap; gap: 6px 22px; }
.stat b { font-family: var(--f-display); font-size: 24px; font-weight: 600; margin-right: 6px; }
.stat span { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; }
.filters { display: flex; align-items: center; gap: 6px; margin-left: auto; flex-wrap: wrap; }
.filters label { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; margin-right: 4px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 11px; cursor: pointer; font-size: 13px; font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
details.how { padding-block: 4px 0; color: var(--muted); font-size: 14px; }
details.how summary { cursor: pointer; width: fit-content; }
details.how div { max-width: 76ch; padding: 8px 0 4px; display: grid; gap: 6px; }

/* league bands */
.league { padding-block: 18px 6px; }
.league-h { display: flex; align-items: baseline; gap: 12px; border-bottom: 2px solid var(--ink); padding-bottom: 4px; margin-bottom: 12px; }
.league-h h2 { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .04em; font-size: 21px; font-weight: 700; margin: 0; }
.league-h span { color: var(--muted); font-size: 13px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 330px), 1fr)); gap: 12px; }

/* match card */
.card { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 12px 14px; cursor: pointer; display: grid; gap: 9px; min-width: 0; transition: border-color .15s, transform .15s; }
.card:hover { border-color: var(--accent); }
@media (prefers-reduced-motion: no-preference) { .card:hover { transform: translateY(-1px); } }
.row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.kick { font-family: var(--f-display); font-weight: 600; font-size: 17px; }
.status { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; padding: 2px 7px; border-radius: 4px; background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.status.live { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.status.ft { background: var(--ink); color: var(--bg); border-color: transparent; }
.teams { display: grid; gap: 2px; }
.team { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.team .nm { font-family: var(--f-display); font-weight: 600; font-size: 20px; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.team .pos { color: var(--muted); font-size: 12px; font-family: var(--f-mono); flex: none; }
.team .sc { margin-left: auto; font-family: var(--f-mono); font-weight: 600; font-size: 18px; }
.type { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; padding: 3px 9px; border-radius: 4px; background: var(--accent-soft); color: var(--ink); width: fit-content; max-width: 100%; }
.type i { width: 8px; height: 8px; border-radius: 2px; background: var(--accent); flex: none; }
.toppick { background: var(--surface-2); border-radius: 8px; padding: 8px 10px; display: grid; gap: 3px; }
.toppick .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.toppick .bet { font-weight: 700; }
.toppick .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 13px; color: var(--muted); }
.why { color: var(--muted); font-size: 14px; }
.foot { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 13px; color: var(--muted); }
.foot .key { color: var(--bad); font-weight: 600; }

.pips { display: inline-flex; gap: 3px; vertical-align: middle; }
.pips i { width: 9px; height: 9px; border-radius: 50%; background: var(--pip-off); }
.pips i.on { background: var(--accent); }
.pct { font-family: var(--f-mono); font-variant-numeric: tabular-nums; color: var(--ink); font-weight: 600; }
.fair { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.tag { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; padding: 1px 6px; border-radius: 4px; }
.tag.fits { background: var(--ok-soft); color: var(--ok); }
.tag.against { background: var(--bad-soft); color: var(--bad); }
.tag.neutral { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.tag.sit { background: var(--warn-soft); color: var(--warn); }
.tag.up { background: var(--accent-soft); color: var(--ink); }
.lsec { padding-block: 16px 4px; display: grid; gap: 8px; max-width: 980px; }
.lsec h3 { margin: 0; font-family: var(--f-display); text-transform: uppercase; letter-spacing: .05em; font-size: 19px; }
.lsec p { margin: 0; max-width: 80ch; }
.lsec ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.big { font-family: var(--f-display); font-size: 34px; font-weight: 700; line-height: 1; }
.kpis { display: flex; flex-wrap: wrap; gap: 10px 28px; }
.kpis div span { display: block; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
td.good { color: var(--ok); font-weight: 600; } td.bad { color: var(--bad); font-weight: 600; }
.filters2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 170px), 1fr)); gap: 8px 12px; align-items: end; }
.fsel { display: grid; gap: 3px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; min-width: 0; }
.fsel select, .fsel input { font: inherit; font-size: 14px; text-transform: none; letter-spacing: 0; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; min-width: 0; width: 100%; }
.kpis2 .big { font-size: 28px; } .big.good { color: var(--ok); } .big.bad { color: var(--bad); }
table.sortable th { cursor: pointer; user-select: none; } table.sortable th:hover { color: var(--ink); }
tr.clickrow { cursor: pointer; } tr.clickrow:hover td { background: var(--surface-2); }
table.bets td.wrap { white-space: normal; min-width: 220px; }
td.res.hit { color: var(--ok); font-weight: 700; } td.res.miss { color: var(--bad); font-weight: 700; } td.res.void, td.res.pending { color: var(--muted); }
.chart-wrap { max-width: 860px; } svg.chart { display: block; }
svg.chart .grid { stroke: var(--line); stroke-width: 1; } svg.chart .ax { fill: var(--muted); font-size: 11px; font-family: var(--f-mono); }
svg.chart .nbar { fill: var(--pip-off); } svg.chart .rline { stroke: var(--accent); stroke-width: 2.5; } svg.chart .pline { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 4; }
svg.chart .rdot { fill: var(--accent); }

.empty { color: var(--muted); padding: 30px 0; }

/* side sheet */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; }
.sheet { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100%); background: var(--bg); z-index: 21; overflow-y: auto; border-left: 1px solid var(--line);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px); }
.sheet-h { position: sticky; top: 0; background: var(--surface); border-bottom: 1px solid var(--line); padding: 12px 18px; display: flex; gap: 12px; align-items: flex-start; z-index: 1; }
.sheet-h .t { flex: 1; min-width: 0; }
.sheet-h .lg { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.sheet-h h3 { font-family: var(--f-display); font-size: 26px; font-weight: 700; margin: 2px 0 0; line-height: 1.1; text-wrap: balance; }
.close { border: 1px solid var(--line); background: var(--surface-2); border-radius: 6px; padding: 4px 10px; cursor: pointer; font-weight: 600; }
.sheet-b { padding: 6px 18px 40px; display: grid; gap: 4px; }
.sec { padding-block: 14px 6px; border-bottom: 1px solid var(--line); display: grid; gap: 8px; min-width: 0; }
.sec h4 { margin: 0; font-family: var(--f-display); text-transform: uppercase; letter-spacing: .06em; font-size: 16px; font-weight: 700; display: flex; align-items: baseline; gap: 8px; }
.sec h4 small { font-family: var(--f-body); text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--muted); font-size: 13px; }
.sec ul { margin: 0; padding-left: 18px; display: grid; gap: 3px; }
.sharebar { display: grid; gap: 4px; }
.sharebar .lab { display: flex; justify-content: space-between; font-size: 13px; }
.sharebar .track { height: 10px; border-radius: 5px; background: var(--pip-off); overflow: hidden; display: flex; }
.sharebar .h { background: var(--ink); }
.sharebar .a { background: var(--accent); }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px 14px; font-size: 14px; }
.kv div span { color: var(--muted); display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
.tbl-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
td.n, th.n { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.abs { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.abs b { display: block; font-size: 13px; margin-bottom: 2px; }
.abs li.k { color: var(--bad); font-weight: 600; }

/* picks */
.picks { display: grid; gap: 6px; }
.pick { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); min-width: 0; }
.pick { display: grid; grid-template-columns: 1fr auto; align-items: start; }
.pick > .reason { grid-column: 1 / -1; }
.pick.mine { border-color: var(--ok); }
.mostline { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font-size: 14px; }
.mostline .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.tick { align-self: center; margin-right: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }
.tick[aria-pressed="true"] { background: var(--ok-soft); color: var(--ok); border-color: var(--ok); }
.tick.small { padding: 2px 8px; margin: 0; }
.legrow { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; border-top: 1px solid var(--line); }
.legrow .leg { border-top: 0; }
.mybtn { white-space: nowrap; } .mybtn.err { border-color: var(--bad); color: var(--bad); }
.minec { color: var(--ok); font-weight: 600; } .errtxt { color: var(--bad); }
.sheet a { color: var(--accent); }
.pick > button:not(.tick) { width: 100%; background: none; border: 0; text-align: left; padding: 9px 12px; cursor: pointer; display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; }
.pick .pl { font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.pick .pm { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--muted); }
.pick .ps { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; font-size: 13px; color: var(--muted); align-items: center; }
.pick[open-pick] { border-color: var(--accent); }
.reason { padding: 2px 12px 12px; display: grid; gap: 10px; border-top: 1px dashed var(--line); }
.reason ul { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 3px; }
.splits { display: grid; gap: 4px; }
.split { display: grid; grid-template-columns: minmax(110px, 190px) 1fr 74px; gap: 10px; align-items: center; font-size: 13px; }
.split .sbar { height: 8px; border-radius: 4px; background: var(--pip-off); overflow: hidden; }
.split .sbar i { display: block; height: 100%; background: var(--muted); }
.split.hl { font-weight: 700; }
.split.hl .sbar i { background: var(--accent); }
.split.hind { opacity: .65; font-style: italic; }
.split .v { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.subh { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }

/* slips / singles / edges lists */
.slips { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 360px), 1fr)); gap: 12px; padding-block: 16px; }
.slip { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 8px; box-shadow: var(--shadow); min-width: 0; }
.slip-h { display: flex; align-items: baseline; gap: 10px; }
.slip-h b { font-family: var(--f-display); font-size: 20px; text-transform: uppercase; letter-spacing: .03em; }
.slip-h .tot { margin-left: auto; font-size: 13px; color: var(--muted); }
.leg { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding-block: 6px; border-top: 1px solid var(--line); cursor: pointer; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; }
.leg .fx { grid-column: 1 / -1; font-size: 12px; color: var(--muted); }
.leg .lb { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.leg .mm { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.list { display: grid; gap: 8px; padding-block: 16px; max-width: 900px; }
.note { color: var(--muted); font-size: 14px; max-width: 80ch; padding-top: 14px; }
.load { padding: 60px 0; color: var(--muted); }

/* team panel: past games + averages for both teams of a bet */
.tpanel { display: grid; gap: 10px; min-width: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; width: fit-content; max-width: 100%; }
.seg button { border: 0; background: var(--surface); padding: 5px 12px; font-weight: 600; cursor: pointer; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.thead { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; font-size: 13px; color: var(--muted); }
.thead b { color: var(--ink); font-size: 15px; }
.form { display: inline-flex; gap: 3px; flex-wrap: wrap; }
.wdl { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 4px; font-size: 11px; font-weight: 700; font-style: normal; }
.wdl.W { background: var(--ok-soft); color: var(--ok); } .wdl.D { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); } .wdl.L { background: var(--bad-soft); color: var(--bad); }
table.games td { padding-block: 4px; } table.games td.opp { white-space: normal; min-width: 130px; }
table.games td.opp small { display: block; color: var(--muted); font-size: 11px; }
table.games tr.this td { background: var(--accent-soft); font-weight: 700; }
table.games tr.after td { opacity: .55; }
table.games .rs { display: inline-flex; align-items: center; gap: 6px; }
table.avgs td:first-child { color: var(--muted); }
.linkbtn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font-weight: 600; font-size: 13px; width: fit-content; }
.tnote { font-size: 12px; color: var(--muted); }

/* slip builder */
.acts { display: flex; align-items: center; gap: 6px; margin-right: 10px; } .acts .tick { margin: 0; } .legrow .acts { margin: 0; }
.tick.sbt[aria-pressed="true"] { background: var(--accent-soft); color: var(--ink); border-color: var(--accent); }
.sbbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 19; display: flex; align-items: center; gap: 12px;
  background: var(--ink); color: var(--bg); border: 0; border-radius: 999px; padding: 10px 18px; box-shadow: var(--shadow); cursor: pointer; font-size: 14px; max-width: calc(100% - 32px); white-space: nowrap; }
.sbbar .pct, .sbbar .fair { color: var(--bg); } .sbbar .open { font-weight: 700; color: var(--accent); } .sbbar .warnc { color: var(--accent); font-size: 12px; }
body.has-sb main { padding-bottom: 80px; }
.ladder { display: grid; gap: 6px; } table.lad td { padding-block: 3px; } table.lad tr.main td { background: var(--accent-soft); font-weight: 700; }
table.lad .addl { padding: 1px 9px; } table.lad td.wrap { white-space: normal; min-width: 130px; max-width: 170px; } table.lad th, table.lad td { padding-inline: 5px; } table.lad small { color: var(--muted); display: block; font-size: 11px; line-height: 1.3; margin-top: 2px; }
.bleg { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 10px 12px; display: grid; gap: 6px; }
.bleg.fail { border-color: var(--bad); }
.bleg .fxl { font-size: 12px; color: var(--muted); }
.stepper { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; }
.stepper .lbl { text-align: center; overflow-wrap: anywhere; }
.chip:disabled { opacity: .4; cursor: default; }
.chip.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); padding: 6px 16px; width: fit-content; }
.failtxt { color: var(--bad); }
.oddsin { display: grid; gap: 3px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

<aside class="sheet" id="sheet" hidden aria-modal="true" role="dialog" aria-labelledby="sheet-title"></aside>

<script>
(() => {
  const $ = (t, cls, txt) => { const e = document.createElement(t); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };
  const pct = p => p == null ? '—' : Math.round(p * 100) + '%';
  const fx = n => n == null ? '—' : n.toFixed(2);
  const pips = c => { const s = $('span', 'pips'); s.setAttribute('aria-label', `confidence ${c} of 5`); for (let i = 1; i <= 5; i++) s.append($('i', i <= c ? 'on' : '')); return s; };
  const fitTag = f => $('span', 'tag ' + (f === 'fits' ? 'fits' : f === 'against type' ? 'against' : 'neutral'), f === 'fits' ? 'fits type' : f === 'against type' ? 'against type' : 'neutral');
  let D = null, view = 'board', minConf = 1, fitsOnly = false;
  try { const v = localStorage.getItem('bbb-conf'); if (v) minConf = +v; } catch (e) {}

  const statusPill = g => {
    if (g.status === 'finished') return $('span', 'status ft', 'FT');
    if (g.status === 'inprogress') return $('span', 'status live', 'Live');

  const scoreOf = (g, side) => g.score ? g.score.split('-')[side === 'home' ? 0 : 1] : null;
  const ord = n => n + (['th','st','nd','rd'][(n % 100 - 20) % 10] || ['th','st','nd','rd'][n % 100] || 'th');
  const keyAbs = g => ['home', 'away'].flatMap(s => (g.absences[s] || []).filter(a => a.key).map(a => a.name));
  const visiblePicks = g => g.picks.filter(p => p.conf >= minConf && (!fitsOnly || p.fit === 'fits'));

  function teamLine(g, side) {

    const teams = $('div', 'teams'); teams.append(teamLine(g, 'home'), teamLine(g, 'away'));
    const ty = $('span', 'type'); ty.append($('i'), document.createTextNode(g.type));
    c.append(r1, teams, ty);
    if (g.most) { const ms = $('div', 'mostline'); ms.append($('span', 'lbl', 'Most shots'), $('b', null, g.most.team), $('span', null, `${Math.round(g.most.share * 100)}% of shots`),
      $('span', 'pct', pct(g.most.P)), $('span', null, 'fair '), ); ms.lastChild.append($('span', 'fair', fx(g.most.fair))); c.append(ms); }
    if (top) {

      tp.append($('span', 'lbl', 'Top pick'), $('span', 'bet', top.label));
      const m = $('div', 'meta'); m.append($('span', 'pct', pct(top.P)), $('span', null, 'fair '), fitTag(top.fit));

    }
    c.append($('div', 'why', g.why[0]));
    const f = $('div', 'foot');
    const vp = visiblePicks(g).length;
    f.append($('span', null, `${vp} pick${vp === 1 ? '' : 's'}` + (vp !== g.picks.length ? ` of ${g.picks.length}` : '')));
    if (g.edges.length) f.append($('span', null, `${g.edges.length} situational`));
    const nm = g.picks.concat(g.edges).filter(p => isMine(p.id)).length; if (nm) f.append($('span', 'minec', `✓ ${nm} my bet${nm > 1 ? 's' : ''}`));
    const ka = keyAbs(g); if (ka.length) f.append($('span', 'key', 'Out: ' + ka.join(', ')));
    c.append(f);
    c.addEventListener('click', () => openGame(g.eventId));
    return c;
  }

  function renderBoard(main) {
    const all = D.leagues.flatMap(l => l.games);
    const bar = $('div', 'bar');
    const stats = $('div', 'stats');
    const npk = all.reduce((s, g) => s + visiblePicks(g).length, 0);
    const n5 = all.reduce((s, g) => s + g.picks.filter(p => p.conf === 5).length, 0);
    const ne = all.reduce((s, g) => s + g.edges.length, 0);
    [[all.length, 'games'], [D.leagues.length, 'leagues'], [npk, 'picks shown'], [n5, 'confidence 5'], [ne, 'situational']].forEach(([n, l]) => {
      const s = $('div', 'stat'); s.append($('b', null, n), $('span', null, l)); stats.append(s); });
    const fl = $('div', 'filters'); fl.append($('label', null, 'Confidence'));
    [[1, 'All'], [3, '3+'], [4, '4+'], [5, '5']].forEach(([v, l]) => {
      const b = $('button', 'chip', l); b.type = 'button'; b.setAttribute('aria-pressed', String(minConf === v));
      b.addEventListener('click', () => { minConf = v; try { localStorage.setItem('bbb-conf', v); } catch (e) {} render(); }); fl.append(b); });
    const fb = $('button', 'chip', 'Fits type only'); fb.type = 'button'; fb.setAttribute('aria-pressed', String(fitsOnly));
    fb.addEventListener('click', () => { fitsOnly = !fitsOnly; render(); }); fl.append(fb);
    bar.append(stats, fl); main.append(bar, howTo());
    D.leagues.forEach(l => {
      const sec = $('section', 'league'); const h = $('div', 'league-h');
      h.append($('h2', null, l.name), $('span', null, `${l.games.length} game${l.games.length > 1 ? 's' : ''}`));
      const grid = $('div', 'grid'); l.games.forEach(g => grid.append(card(g)));
      sec.append(h, grid); main.append(sec);
    });
  }

  function howTo() {
    const d = $('details', 'how'); d.append($('summary', null, 'How picks, confidence and the fair price work'));
    const b = $('div');
    ['Every pick needs a record of 80%+ on both sides of the match-up. P is the lower of the record and the projection model.',
     'Confidence 1–5 comes from P: 95%+ is 5, 90% is 4, 85% is 3, 80% is 2. It goes up one when the pick fits the match type and the player or team cleared it 90%+ in games like tonight (5+ games). It goes down one when it goes against the match type or a key player on that side is out.',
     '"Like tonight" means past matches with the same pre-match status (favourite, even, underdog from the table) and, where there are 5+, the same half of the table as tonight\'s opponent.',
     'Player lines count the Bet365 slot: his number plus whoever came on for him. Only bet confirmed starters.',
     'Fair = 1 ÷ P. It is there to compare with Bet365; picks are chosen on likelihood only.',
     'Situational picks are lines that only hold in a certain kind of game (90%+ there, 60% or less otherwise). They are new and unproven, capped at confidence 3, and tracked.'
    ].forEach(t => b.append($('p', null, t)));
    b.querySelectorAll('p').forEach(p => p.style.margin = '0');
    d.append(b); return d;
  }

  /* ---------- match sheet ---------- */
  function openGame(id, pickId) {
    const g = D.leagues.flatMap(l => l.games).find(x => String(x.eventId) === String(id)); if (!g) return;
    const sh = document.getElementById('sheet'); sh.replaceChildren();
    const hd = $('div', 'sheet-h'); const t = $('div', 't');
    t.append($('div', 'lg', `${g.league} · ${g.kickoff}${g.venue ? ' · ' + g.venue : ''}`));
    const h3 = $('h3', null, `${g.home} ${g.score ? g.score.replace('-', '–') : 'v'} ${g.away}`); h3.id = 'sheet-title'; t.append(h3);
    const cl = $('button', 'close', 'Close'); cl.type = 'button'; cl.addEventListener('click', closeSheet);
    hd.append(t, cl); sh.append(hd);
    const b = $('div', 'sheet-b'); sh.append(b);

    // 1 match type
    const s1 = sec('Match type', g.type);
    const sbar = $('div', 'sharebar'); const lab = $('div', 'lab');
    const hs = Math.round(g.share * 100);
    lab.append($('span', null, `${g.home} ${hs}%`), $('span', null, 'projected share of shots'), $('span', null, `${100 - hs}% ${g.away}`));
    const tr = $('div', 'track'); const h1 = $('div', 'h'); h1.style.width = hs + '%'; const a1 = $('div', 'a'); a1.style.width = (100 - hs) + '%'; tr.append(h1, a1);
    sbar.append(lab, tr); s1.append(sbar);
    const ul = $('ul'); g.why.forEach(w => ul.append($('li', null, w))); s1.append(ul);
    const kv = $('div', 'kv');
    kv.append(kvp('Projected shots', g.projShots), kvp('Projected tackles', g.projTackles),
      kvp(`${g.home} go in`, `${g.tonight.home.status} · ${g.tonight.home.ppg ?? '—'} pts/game`),
      kvp(`${g.away} go in`, `${g.tonight.away.status} · ${g.tonight.away.ppg ?? '—'} pts/game`));
    s1.append(kv, para('Points to: ' + g.markets.join(' · '))); b.append(s1);
    if (g.most) {
      const m = g.most, sM = sec('Most shots', 'Bet365: team to get most shots');
      const bx = $('div', 'pick'); const bt = $('button'); bt.type = 'button';
      const pm = $('span', 'pm'); pm.append(pips(m.conf), $('span', 'pct', pct(m.P))); const fr = $('span', null, 'fair '); fr.append($('span', 'fair', fx(m.fair))); pm.append(fr);
      const ps = $('span', 'ps'); ps.append($('span', null, `projected ${Math.round(m.share * 100)}% of the shots`), $('span', null, `own record ${m.own[0]}/${m.own[1]}`), $('span', null, `opponent out-shot ${m.opp[0]}/${m.opp[1]}`));
      bt.append($('span', 'pl', m.label), pm, ps); bx.append(bt, acts(m.id, tickBtn('bet', m.id))); if (isMine(m.id)) bx.classList.add('mine');
      const rs = $('div', 'reason'); const u = $('ul'); m.reasons.forEach(r => u.append($('li', null, r))); rs.append(u); bx.append(rs);
      const tb = $('button', 'linkbtn', 'Show team data'); tb.type = 'button'; let tp = null;
      tb.addEventListener('click', () => { if (tp) { tp.remove(); tp = null; tb.textContent = 'Show team data'; return; }
        tp = teamPanel([g.home, g.away], m.team, g.eventId, D.date); rs.append(tp); tb.textContent = 'Hide team data'; });
      rs.append(tb); bt.addEventListener('click', () => tb.click());
      sM.append(bx); b.append(sM);
    }

    // 2 picks
    const vis = visiblePicks(g);
    const s2 = sec('Picks', `${vis.length}${vis.length !== g.picks.length ? ' of ' + g.picks.length + ' (filter on)' : ''} · sorted by confidence`);
    const pk = $('div', 'picks'); vis.forEach(p => pk.append(pickRow(p, g))); s2.append(pk); b.append(s2);
    if (g.edges.length) {
      const s3 = sec('Situational', 'lines that only hold in this kind of game — unproven, tracked');
      const ek = $('div', 'picks'); g.edges.forEach(e => ek.append(pickRow(e, g, true))); s3.append(ek); b.append(s3);
    }
    // trends: last 5 v the 8 before, with how much such runs usually keep
    if (g.trends && g.trends.length) {
      const sT = sec('Trends', 'last 5 matches v the 8 before · history says how much usually carries on');
      const ul2 = $('ul'); g.trends.forEach(t => { const li = $('li', null, t.text); const m = $('div', 'subh', 'Points to: ' + t.markets); m.style.textTransform = 'none'; li.append(m); ul2.append(li); });
      sT.append(ul2); b.append(sT);
    }
    // 3 style
    const s4 = sec('How they play', g.style.sH ? g.style.sH.season + ', league matches' : '');
    s4.append(para(`${g.home}: ${g.style.home}`), para(`${g.away}: ${g.style.away}`));
    if (g.style.sH && g.style.sA) {
      const rows = [['Possession %', 'poss', 0], ['Shots', 'shots', 1], ['Shots against', 'shotsAg', 1], ['xG', 'xg', 2], ['Big chances', 'bigCh', 1],
        ['Tackles + interceptions', 'defActs', 1], ['Counter-attacks', 'fastBreaks', 1], ['Crosses', 'crosses', 1], ['Long-ball share %', 'longShare', 0], ['Fouls', 'fouls', 1], ['Goals for', 'gf', 1], ['Goals against', 'ga', 1]];
      const w = $('div', 'tbl-wrap'); const tb = $('table'); const th = $('tr');
      th.append($('th', null, 'Per match'), $('th', 'n', g.home), $('th', 'n', g.away)); tb.append(th);
      rows.forEach(([l, k, d]) => { const r = $('tr'); r.append($('td', null, l), $('td', 'n', (g.style.sH[k] ?? 0).toFixed(d)), $('td', 'n', (g.style.sA[k] ?? 0).toFixed(d))); tb.append(r); });
      w.append(tb); s4.append(w);
    }
    b.append(s4);
    const sG = sec('Recent games', 'both teams · past results, xG, shots, possession');
    sG.append(teamPanel([g.home, g.away], g.home, g.eventId, D.date)); b.append(sG);
    // 4 table
    const s5 = sec('Table', 'what the game means');
    const kv2 = $('div', 'kv');
    ['home', 'away'].forEach(s => { const tb = g.table[s]; kv2.append(kvp(g[s], tb ? `${ord(tb.pos)} of ${tb.of} · ${tb.pts} pts in ${tb.played} · ${tb.zone}` : 'no table')); });
    s5.append(kv2); b.append(s5);
    // 5 absences
    const s6 = sec('Absences', g.absences.confirmed ? 'line-ups confirmed' : 'line-ups not confirmed yet');
    const ab = $('div', 'abs');
    ['home', 'away'].forEach(s => { const d = $('div'); d.append($('b', null, g[s])); const u = $('ul');
      const L = g.absences[s] || []; if (!L.length) u.append($('li', null, 'Nobody listed'));
      L.forEach(a => u.append($('li', a.key ? 'k' : '', `${a.name} — ${a.why}${a.key ? ' · KEY: ' + a.key : ''}`))); d.append(u); ab.append(d); });
    s6.append(ab); b.append(s6);
    // 6 h2h
    const s7 = sec('Head to head', g.h2h.n ? `last ${g.h2h.n}: ${g.h2h.avgGoals} goals a game · over 2.5 ${g.h2h.over25}/${g.h2h.n} · both scored ${g.h2h.btts}/${g.h2h.n}` : 'no recent meetings');
    if (g.h2h.list && g.h2h.list.length) { const u = $('ul'); g.h2h.list.forEach(x => u.append($('li', 'num', x))); s7.append(u); }
    b.append(s7);

    document.getElementById('scrim').hidden = false; sh.hidden = false; sh.scrollTop = 0; cl.focus();
    try { history.replaceState(null, '', '#g' + g.eventId); } catch (e) {}
    if (pickId) { const el = sh.querySelector(`[data-pick="${CSS.escape(pickId)}"] > button`); if (el) { el.click(); el.scrollIntoView({ block: 'center' }); } }
  }
  function closeSheet() {
    document.getElementById('sheet').hidden = true; document.getElementById('scrim').hidden = true;
    try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  }
  const sec = (h, small) => { const s = $('section', 'sec'); const hh = $('h4', null, h); if (small) hh.append($('small', null, small)); s.append(hh); return s; };
  const kvp = (k, v) => { const d = $('div'); d.append($('span', null, k), document.createTextNode(v)); return d; };
  const para = t => { const p = $('p', null, t); p.style.margin = '0'; return p; };

  /* ---------- team panel (Nathan, 2026-10-19: "see more team data like past games and other stats like xG when I click
     on a suggested bet from any tab"). Data: teams.json (tools/team-sheet.py), loaded on first use. ---------- */
  let TJ = null, TJP = null;
  const loadTeams = () => TJP || (TJP = fetch('teams.json', { cache: 'no-store' }).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(j => (TJ = j)));
  const dmy = d => d ? new Date(d + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' }) : '—';
  const wdl = r => r.gf > r.ga ? 'W' : r.gf < r.ga ? 'L' : 'D';
  const pair = (a, b, d) => a == null && b == null ? '—' : `${a == null ? '—' : a.toFixed(d)}–${b == null ? '—' : b.toFixed(d)}`;
  function avgCell(rows, k, d) {
    const v = rows.map(r => r[k]).filter(x => x != null); if (!v.length) return '—';
    const m = v.reduce((a, x) => a + x, 0) / v.length; return m.toFixed(d) + (v.length < rows.length ? ` (${v.length})` : '');
  }
  /* teams: [home, away]; focus: the bet's team; ev/date: the bet's match (past bets: games after it are hidden by default,
     its own row is highlighted, and the averages use only the games before it). */
  function teamPanel(teams, focus, ev, date) {
    teams = (teams || []).filter(Boolean); if (!teams.length) return $('div');
    let cur = teams.includes(focus) ? focus : teams[0], showAll = false, showAfter = false;
    const box = $('div', 'tpanel'); box.append($('div', 'tnote', 'Loading team data…'));
    const draw = () => {
      box.replaceChildren();
      if (teams.length > 1) { const sg = $('div', 'seg'); sg.setAttribute('role', 'group'); sg.setAttribute('aria-label', 'Team');
        teams.forEach(t => { const b = $('button', null, t); b.type = 'button'; b.setAttribute('aria-pressed', String(t === cur));
          b.addEventListener('click', e => { e.stopPropagation(); cur = t; showAll = false; showAfter = false; draw(); }); sg.append(b); }); box.append(sg); }
      const T = TJ && TJ.teams[cur];
      if (!T || !T.g.length) { box.append($('div', 'tnote', `No past games stored for ${cur} yet. They are added by the morning run.`)); return; }
      const G = T.g, at = ev ? G.findIndex(r => String(r.ev) === String(ev)) : -1;
      const isAfter = r => at >= 0 ? G.indexOf(r) < at : (date && r.d > date);
      const before = G.filter(r => !isAfter(r) && String(r.ev) !== String(ev) && (!date || r.d <= date));
      const later = G.filter(isAfter);
      // header: league, table, form
      const hd = $('div', 'thead'); hd.append($('b', null, cur));
      if (T.lg) hd.append($('span', null, T.lg));
      if (T.tbl && T.tbl.pos) hd.append($('span', null, `${ord(T.tbl.pos)} of ${T.tbl.of} · ${T.tbl.pts} pts in ${T.tbl.played}`));
      const fm = $('span', 'form'); fm.setAttribute('aria-label', 'Form, newest first');
      before.slice(0, 10).forEach(r => { const i = $('i', 'wdl ' + wdl(r), wdl(r)); i.title = `${dmy(r.d)} ${r.h ? 'v' : '@'} ${r.o} ${r.gf}–${r.ga}`; fm.append(i); });
      const fl = $('span'); fl.append(document.createTextNode(`Form (last ${Math.min(10, before.length)}, newest first) `), fm); hd.append(fl);
      box.append(hd);
      // averages: last 5 / last 10 before the bet's match, this season, last season
      const l5 = before.slice(0, 5), l10 = before.slice(0, 10), C = T.cur, P = T.prev;
      const A = [['Goals for', 'gf', 2, C && C.gf, P && P.gf], ['Goals against', 'ga', 2, C && C.ga, P && P.ga], ['xG for', 'xg', 2, C && C.xg, P && P.xgF], ['xG against', 'xa', 2, null, null],
        ['Shots for', 'sh', 1, C && C.shots, P && P.shF], ['Shots against', 'sa', 1, C && C.shotsAg, P && P.shA], ['On target for', 'st', 1, null, P && P.sotF], ['On target against', 'sta', 1, null, P && P.sotA],
        ['Big chances for', 'bc', 1, C && C.bigCh, null], ['Possession %', 'po', 0, C && C.poss, P && P.poss], ['Tackles', 'tk', 1, null, P && P.tkF]];
      const aw = $('div', 'tbl-wrap'), at_ = $('table', 'avgs'), ah = $('tr');
      ah.append($('th', null, 'Per match'), $('th', 'n', `Last ${l5.length}`), $('th', 'n', `Last ${l10.length}`), $('th', 'n', C ? `Season (${C.m})` : 'Season'), $('th', 'n', P ? `Last season (${P.matches})` : 'Last season'));
      at_.append(ah);
      A.forEach(([l, k, d, c, p]) => { const tr = $('tr'); tr.append($('td', null, l), $('td', 'n', avgCell(l5, k, d)), $('td', 'n', avgCell(l10, k, d)),
        $('td', 'n', c == null ? '—' : (+c).toFixed(d)), $('td', 'n', p == null ? '—' : (+p).toFixed(d))); at_.append(tr); });
      aw.append(at_); box.append(aw);
      box.append($('div', 'tnote', 'Last 5 and last 10 count every competition' + (ev && at >= 0 ? ', before this bet\'s match' : '') + '. A number in brackets = how many of those games had that stat. Season = league matches this season' + (C && C.asof && C.asof !== (D && D.date) ? ` (as of ${dmy(C.asof)})` : '') + '. xG comes from Sofascore and is missing in leagues it does not measure.'));

  function dayChart(pts) {
    const W = 760, H = 220, L = 40, R = 12, T = 12, B = 34, ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg'); svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.setAttribute('width', '100%'); svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', 'Hit rate by day against promised P'); svg.classList.add('chart');
    const el = (n, a, txt) => { const e = document.createElementNS(ns, n); Object.entries(a).forEach(([k, v]) => e.setAttribute(k, v)); if (txt != null) e.textContent = txt; svg.append(e); return e; };
    const iw = W - L - R, ih = H - T - B, step = iw / pts.length, y = v => T + ih * (1 - v), maxN = Math.max(...pts.map(p => p.n));
    [0, .25, .5, .75, 1].forEach(v => { el('line', { x1: L, x2: W - R, y1: y(v), y2: y(v), class: 'grid' }); el('text', { x: L - 6, y: y(v) + 4, 'text-anchor': 'end', class: 'ax' }, Math.round(v * 100) + '%'); });
    pts.forEach((p, i) => { const h = ih * 0.35 * p.n / maxN, x = L + i * step + step * 0.2; el('rect', { x, y: T + ih - h, width: step * 0.6, height: h, class: 'nbar' });
      if (pts.length <= 16 || i % Math.ceil(pts.length / 12) === 0) el('text', { x: L + i * step + step / 2, y: H - 14, 'text-anchor': 'middle', class: 'ax' }, p.d.slice(5)); });
    const line = (k, cls) => { const P = pts.map((p, i) => p[k] == null ? null : [L + i * step + step / 2, y(p[k])]).filter(Boolean);
      if (P.length) el('polyline', { points: P.map(p => p.join(',')).join(' '), class: cls, fill: 'none' }); return P; };
    line('P', 'pline'); const RP = line('rate', 'rline');
    RP.forEach((p, i) => { const c = el('circle', { cx: p[0], cy: p[1], r: 4, class: 'rdot' }); const d = pts.filter(q => q.rate != null)[i];
      const tt = document.createElementNS(ns, 'title'); tt.textContent = `${d.d}: ${Math.round(d.rate * 100)}% of ${d.n} (promised ${d.P == null ? '—' : Math.round(d.P * 100) + '%'})`; c.append(tt); });
    const w = $('div', 'chart-wrap'); w.append(svg); return w;
  }
